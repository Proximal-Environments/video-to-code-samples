jobs_dir: ./jobs
n_attempts: 3

orchestrator:
  n_concurrent_trials: 18

environment:
  type: modal
  kwargs:
    sandbox_timeout_secs: 9000
    registry_secret: gcr-secret

agents:
  - name: claude-code
    model_name: anthropic/claude-opus-4-7
    override_timeout_sec: 7200
    kwargs:
      temperature: 1.0
      reasoning_effort: high
      disallowed_tools: "WebSearch WebFetch"
  - name: codex
    model_name: openai/gpt-5.4
    override_timeout_sec: 7200
    kwargs:
      reasoning_effort: high
      web_search: disabled

tasks:
  - path: .

artifacts:
  - /app/
